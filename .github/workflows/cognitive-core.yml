name: Cognitive Core checks
on:
  push:
    branches: [feature/hg-cognitive-core-v1]
  pull_request:
    paths:
      - 'core/cognitive-core.js'
      - 'tests/cognitive-core.test.mjs'
      - '.github/workflows/cognitive-core.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cognitive-core.test.mjs
