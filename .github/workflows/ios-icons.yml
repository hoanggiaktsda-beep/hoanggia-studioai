name: Generate iOS PNG Icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/brand-mark.svg'
      - '.github/workflows/ios-icons.yml'
permissions:
  contents: write
  actions: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render PNG from canonical HOANGGIA AI brand
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='assets/brand-mark.svg',write_to='assets/'+name,output_width=size,output_height=size)
          PY
      - name: Commit only changed icon assets
        run: |
          export GH_TOKEN="${{ github.token }}"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: generate real PNG icons for iOS home screen'
            git push
            gh workflow run pages.yml --ref main
          fi
