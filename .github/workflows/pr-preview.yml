name: PR Preview Artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          set -e
          for file in app.js core/*.js; do node --check "$file"; done
      - name: Build static preview package
        run: |
          mkdir -p preview
          cp index.html styles.css app.js manifest.webmanifest sw.js preview/
          cp -R core assets preview/
          printf "HOANGGIA AI PR Preview\nCommit: %s\n" "$GITHUB_SHA" > preview/PREVIEW.txt
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: hoanggia-ai-pr-preview
          path: preview
          retention-days: 7
