name: P0 Expert Regression
on:
  push:
    branches: [test/p0-expert-regression]
  pull_request:
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/p0-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only regression suite
        run: node --experimental-default-type=module --test tests/*.test.mjs
