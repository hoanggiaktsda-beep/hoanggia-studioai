name: HOANGGIA AI Quality Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app.js expert09.js core/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Static integration and offline navigation checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const index=readFileSync('index.html','utf8'), expert=readFileSync('expert09.html','utf8'), sw=readFileSync('sw.js','utf8'), js=readFileSync('expert09.js','utf8');
          for(const path of ['index.html','styles.css','app.js','expert09.html','expert09.css','expert09.js','core/multishot-engine.js','assets/brand-mark.svg'])assert.ok(existsSync(path),path);
          assert.match(index,/href="\.\/expert09\.html"/);
          assert.match(expert,/href="\.\/index\.html"/);
          assert.match(sw,/cache\.put\(request, copy\)/);
          assert.doesNotMatch(sw,/cache\.put\("\.\/index\.html", copy\)/);
          for(const path of ['expert09.html','expert09.css','expert09.js','core/multishot-engine.js'])assert.ok(sw.includes('"./'+path+'"'),path);
          for(const id of ['space','outputMode','viewCount','layout','shots','addShot','zone','master','generate','output','status','shotHelp'])assert.ok(expert.includes('id="'+id+'"'),id);
          assert.match(js,/while\(document\.querySelectorAll\("\.shot"\)\.length<count\(\)\)addShot\(\)/);
          console.log('Static integration and offline navigation checks passed');
          NODE

      - name: Verify production dependency graph and mobile icons
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          const sw=readFileSync('sw.js','utf8');
          const manifest=JSON.parse(readFileSync('manifest.webmanifest','utf8'));
          const cachePaths=[...sw.matchAll(/^\s*"((?:\.\/)[^"]+)"/gm)].map(m=>m[1].slice(2));
          for(const file of cachePaths)assert.ok(existsSync(file),'Offline asset missing: '+file);
          function checkImports(file,seen=new Set()){
            if(seen.has(file))return;seen.add(file);
            const src=readFileSync(file,'utf8');
            for(const m of src.matchAll(/(?:import|export)\s+(?:[^'"]*?\s+from\s+)?["'](\.[^"']+)["']/g)){
              const next=resolve(dirname(file),m[1]);
              assert.ok(existsSync(next),'Missing module: '+next);
              assert.ok(cachePaths.some(x=>resolve(x)===next),'Offline module not precached: '+next);
              checkImports(next,seen);
            }
          }
          for(const page of ['index.html','expert09.html']){
            const html=readFileSync(page,'utf8');
            assert.match(html,/apple-touch-icon\.png\?v=13/);
            assert.match(html,/sw\.js\?v=14/);
            for(const m of html.matchAll(/<script\s+type="module"\s+src="\.\/([^"]+)"/g))checkImports(m[1]);
          }
          for(const icon of manifest.icons){
            const path=icon.src.replace(/^\.\//,'');
            assert.ok(existsSync(path),'Missing manifest icon: '+path);
            assert.equal(icon.type,'image/png');
            assert.equal(readFileSync(path).subarray(0,8).toString('hex'),'89504e470d0a1a0a','Invalid PNG: '+path);
          }
          assert.ok(existsSync('assets/apple-touch-icon.png'));
          console.log('Dependency, offline and iOS PNG integrity checks passed');
          NODE

      - name: Expert 09 regression
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {compileMultiShot,compileMultiView} from './core/multishot-engine.js';
          const b={master:'master.jpg',space:'interior',layout:'3x2',zone:'auto',cast:'auto',shots:[]};
          assert.match(compileMultiShot(b),/with 6 distinct photographic panels/);
          assert.match(compileMultiShot({...b,shots:[{angle:'Góc chéo 2\/3',subject:'sofa',person:'female',action:'ngồi uống trà'}]}),/ngồi uống trà/);
          assert.match(compileMultiShot({...b,layout:'2x2'}),/with 4 distinct/);
          assert.match(compileMultiShot({...b,layout:'3x3'}),/with 9 distinct/);
          assert.throws(()=>compileMultiShot({...b,master:''}),/MASTER/);
          assert.throws(()=>compileMultiShot({...b,layout:'2x2',shots:Array(5).fill({})}),/vượt/);
          assert.match(compileMultiView({...b,viewCount:4}),/IMAGE 04 \/ 4/);
          assert.match(compileMultiView({...b,viewCount:4}),/independent numbered shot prompts/);
          assert.match(compileMultiView({...b,viewCount:3}),new RegExp('IMAGE 03 / 3'));
          const mixed={...b,viewCount:4,shots:[{mode:'manual',angle:'Góc chéo 2/3',subject:'sofa',person:'female',action:'uống trà'},{mode:'auto'}]};
          assert.match(compileMultiView(mixed),/ARCHITECT LOCKED SHOT/);
          assert.match(compileMultiView(mixed),/EXPERT-PROPOSED SHOT/);
          assert.match(compileMultiShot(mixed),/AI TỰ ĐỀ XUẤT/);
          // Cross-mode, optional reference, and guardrail coverage
          for(const space of ['interior','architecture']){
            for(const layout of ['2x2','3x2','3x3']){
              const p=compileMultiShot({...b,space,layout});
              assert.match(p,/CONTINUITY LOCK/);
              assert.match(p,/EVIDENCE LIMIT/);
            }
            for(const viewCount of [4,6,9]){
              const p=compileMultiView({...b,space,viewCount});
              assert.match(p,/GLOBAL SPATIAL LOCK/);
              assert.match(p,/EVIDENCE SAFETY/);
              assert.match(p,new RegExp('IMAGE '+String(viewCount).padStart(2,'0')+' \\/ '+viewCount));
            }
          }
          const refs={...b,viewCount:4,face:'face.jpg',bodyText:'Adult, balanced proportions',outfit:'jacket.jpg'};
          assert.match(compileMultiView(refs),/FACE ID FILE/);
          assert.match(compileMultiView(refs),/BODY TEXT/);
          assert.match(compileMultiView(refs),/OUTFIT FILE/);
          assert.throws(()=>compileMultiView({...b,viewCount:4,shots:Array(5).fill({})}),/vượt/);
          assert.throws(()=>compileMultiShot({...b,space:'invalid'}),/không hợp lệ/);
          assert.throws(()=>compileMultiView({...b,space:'invalid',viewCount:4}),/không hợp lệ/);
          const noDup=compileMultiView({...b,viewCount:4,shots:[{mode:'manual',angle:'Toàn cảnh',subject:'facade',person:'none',action:''},{mode:'auto'}]});
          assert.match(noDup,/ARCHITECT LOCKED SHOT: Toàn cảnh/);
          assert.match(noDup,/EXPERT-PROPOSED SHOT: Góc chéo 2\/3/);
          assert.doesNotMatch(noDup,/EXPERT-PROPOSED SHOT: Toàn cảnh/);
          for(const cast of ['pedestrians','visitors','family','cyclists','gardeners','community','crowd','custom']){
            const cfg={...b,space:'architecture',cast,castNote:'lối đi bộ'};
            assert.match(compileMultiShot(cfg),/CHARACTER POLICY/);
            assert.match(compileMultiView({...cfg,viewCount:4}),/CAST:/);
          }
          assert.match(compileMultiShot({...b,space:'architecture',cast:'cyclists'}),/xe đạp/);
          assert.match(compileMultiView({...b,space:'architecture',viewCount:4,cast:'custom',castNote:'cư dân đi dạo'}),/cư dân đi dạo/);
          assert.doesNotMatch(compileMultiShot({...b,cast:'cyclists'}),/xe đạp/);
          const {EXPERT09_ZONES}=await import('./core/multishot-engine.js');
          assert.ok(Object.keys(EXPERT09_ZONES.architecture).length>=15);
          assert.ok(Object.keys(EXPERT09_ZONES.interior).length>=15);
          assert.match(compileMultiShot({...b,space:'architecture',zone:'park'}),/Công viên/);
          assert.match(compileMultiView({...b,space:'architecture',viewCount:4,zone:'walkway'}),/Lối đi bộ/);
          assert.match(compileMultiShot({...b,space:'interior',zone:'wardrobe'}),/Phòng thay đồ/);
          assert.match(compileMultiView({...b,space:'interior',viewCount:4,zone:'ceiling'}),/Trần/);
          assert.doesNotMatch(compileMultiShot({...b,space:'interior',zone:'park'}),/Công viên/);
          assert.doesNotMatch(compileMultiShot({...b,space:'architecture',zone:'wardrobe'}),/Phòng thay đồ/);
          for(const n of [1,2,3,5,7,8,10,12]){
            const result=compileMultiView({...b,viewCount:n,shots:[]});
            assert.match(result,new RegExp('IMAGE '+String(n).padStart(2,'0')+' \\/ '+n));
          }
          assert.throws(()=>compileMultiView({...b,viewCount:0}),/không hợp lệ/);
          assert.throws(()=>compileMultiView({...b,viewCount:13}),/không hợp lệ/);
          assert.match(compileMultiView({...b,viewCount:2,shots:[{mode:'manual',zone:'kitchen',angle:'Góc cao',person:'none',subject:'island'}]}),/Bếp \/ đảo bếp/);
          assert.match(compileMultiShot({...b,shots:[{mode:'manual',zone:'dining',angle:'Toàn cảnh',person:'none'}]}),/Phòng ăn/);
          console.log('Expert 09 regression passed');
          NODE
