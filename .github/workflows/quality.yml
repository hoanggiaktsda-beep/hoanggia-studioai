name: HOANGGIA AI Quality Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app.js core/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
